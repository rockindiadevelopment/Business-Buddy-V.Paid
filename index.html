<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Buddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #2d3748; }
    ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #718096; }

    .chat-bubble-user {
      background-color: #4f46e5;
      color: white;
    }
    .chat-bubble-bot {
      background-color: #4b5563;
      color: white;
    }
    /* Typing indicator animation */
    .typing-indicator span {
      height: 8px;
      width: 8px;
      float: left;
      margin: 0 1px;
      background-color: #9E9EA1;
      display: block;
      border-radius: 50%;
      opacity: 0.4;
      animation: 1s blink infinite .3333s;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .6666s; }
    .typing-indicator span:nth-child(3) { animation-delay: .9999s; }
    @keyframes blink { 50% { opacity: 1; } }
  </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen">

  <!-- Header -->
  <header class="bg-gray-800 shadow-lg p-4 flex items-center space-x-4 sticky top-0 z-10">
    <div class="p-2 bg-indigo-600 rounded-lg">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="text-white">
        <path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 
        2 0 0 0-2 2v2"/><path d="M16 6h2a2 2 0 0 1 
        2 2v8a2 2 0 0 1-2 2h-2"/><path d="M8 6H6a2 2 0 
        0 0-2 2v8a2 2 0 0 0 2 2h2"/><rect width="12" 
        height="12" x="6" y="10" rx="2"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-100">Business Buddy</h1>
  </header>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Chat Messages -->
    <div id="chat-container" class="flex-1 p-6 overflow-y-auto">
      <div class="space-y-4">
        <!-- Initial bot message -->
        <div class="flex items-start gap-3">
          <div class="p-2 bg-indigo-600 rounded-full h-8 w-8 flex-shrink-0 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 
              0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M16 6h2a2 
              2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/><path d="M8 
              6H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 
              2h2"/><rect width="12" height="12" x="6" y="10" rx="2"/>
            </svg>
          </div>
          <div class="chat-bubble-bot p-4 rounded-lg max-w-lg">
            <p>Hello! I'm Business Buddy 👋. I provide professional advice, motivation, and practical solutions for your business. How can I help you today?</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="p-6 bg-gray-800 border-t border-gray-700">
      <div id="error-message" class="hidden bg-red-500/20 border border-red-500 text-red-300 p-3 rounded-lg mb-4"></div>
      <form id="chat-form" class="relative">
        <textarea id="prompt-input"
          class="w-full bg-gray-700 border border-gray-600 rounded-lg p-4 pr-20 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Ask about your business challenges..."></textarea>
        <button type="submit"
          class="absolute right-4 top-1/2 -translate-y-1/2 bg-indigo-600 p-2 rounded-full hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all duration-200 disabled:bg-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
            viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 
              16zm3.707-8.707l-3-3a1 1 0 00-1.414 
              1.414L10.586 9H7a1 1 0 100 
              2h3.586l-1.293 1.293a1 1 0 101.414 
              1.414l3-3a1 1 0 000-1.414z"
              clip-rule="evenodd"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const promptInput = document.getElementById('prompt-input');
    const errorMessage = document.getElementById('error-message');
    const submitButton = chatForm.querySelector('button[type="submit"]');

    // Demo API Key warning (don’t expose in production)
    const apiKey = "AIzaSyDKIs9Lf10Ni2GyL2P-td88uaTaZiqY7uo";

    // --- Form Submit ---
    chatForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      addMessageToUI('user', prompt);
      promptInput.value = '';
      showLoading(true);
      errorMessage.classList.add('hidden');

      try {
        await generateText(prompt);
      } catch (error) {
        console.error("API Error:", error);
        showError(`Error: ${error.message}`);
      } finally {
        showLoading(false);
      }
    });

    // --- Generate Text ---
    async function generateText(prompt) {
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

      const systemPrompt = "You are 'Business Buddy' build by Rock India Development, a professional and motivational AI mentor. Always give SHORT, SIMPLE, and EASY-TO-UNDERSTAND answers. Avoid long explanations. Use clear and direct language that anyone can quickly understand.";
;

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
      };

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`API request failed: ${response.status}`);
      }

      const result = await response.json();
      const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
      if (text) {
        addTypingEffect(text);
      } else {
        throw new Error("Invalid response from AI.");
      }
    }

    // --- UI Functions ---
    function addMessageToUI(sender, text) {
      const messageContainer = document.createElement('div');
      messageContainer.className = 'flex items-start gap-3 ' + (sender === 'user' ? 'justify-end' : '');

      const bubbleClass = sender === 'user' ? 'chat-bubble-user' : 'chat-bubble-bot';

      let iconHtml = '';
      if (sender === 'bot') {
        iconHtml = `
          <div class="p-2 bg-indigo-600 rounded-full h-8 w-8 flex-shrink-0 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 
              0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M16 6h2a2 
              2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/><path d="M8 
              6H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 
              2h2"/><rect width="12" height="12" x="6" y="10" rx="2"/>
            </svg>
          </div>`;
      }

      const messageHtml = `<div class="${bubbleClass} p-4 rounded-lg max-w-lg"><p>${text}</p></div>`;
      messageContainer.innerHTML = sender === 'bot' ? (iconHtml + messageHtml) : messageHtml;

      chatContainer.querySelector('.space-y-4').appendChild(messageContainer);
      scrollToBottom();
    }

    function addTypingEffect(fullText) {
      const container = document.createElement('div');
      container.className = 'flex items-start gap-3';
      container.innerHTML = `
        <div class="p-2 bg-indigo-600 rounded-full h-8 w-8 flex-shrink-0 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
            fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 
            0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M16 6h2a2 
            2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/><path d="M8 
            6H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 
            2h2"/><rect width="12" height="12" x="6" y="10" rx="2"/>
          </svg>
        </div>
        <div class="chat-bubble-bot p-4 rounded-lg max-w-lg"><p id="typing-text"></p></div>
      `;
      chatContainer.querySelector('.space-y-4').appendChild(container);
      scrollToBottom();

      const typingEl = container.querySelector('#typing-text');
      let index = 0;
      const interval = setInterval(() => {
        typingEl.textContent = fullText.slice(0, index++);
        scrollToBottom();
        if (index > fullText.length) clearInterval(interval);
      }, 40);
    }

    function showLoading(isLoading) {
      submitButton.disabled = isLoading;
      const existingLoader = chatContainer.querySelector('#loading-indicator');
      if (isLoading && !existingLoader) {
        const loader = document.createElement('div');
        loader.id = 'loading-indicator';
        loader.className = 'flex items-start gap-3';
        loader.innerHTML = `
          <div class="p-2 bg-indigo-600 rounded-full h-8 w-8 flex-shrink-0 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 
              0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M16 6h2a2 
              2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/><path d="M8 
              6H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 
              2h2"/><rect width="12" height="12" x="6" y="10" rx="2"/>
            </svg>
          </div>
          <div class="chat-bubble-bot p-4 rounded-lg">
            <div class="typing-indicator"><span></span><span></span><span></span></div>
          </div>
        `;
        chatContainer.querySelector('.space-y-4').appendChild(loader);
        scrollToBottom();
      } else if (!isLoading && existingLoader) {
        existingLoader.remove();
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
